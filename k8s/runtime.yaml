apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rutvi-data
  namespace: rutvi-exercise
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rutvi-runtime
  namespace: rutvi-exercise
data:
  HTTP_PORT: "4000"
  RUTVI_DATABASE: /data/rutvi.sqlite3
  RUTVI_MODEL_PROVIDER: remote_codex
  RUTVI_MODEL_PROFILE: codex_local
  RUTVI_MODEL: gpt-6-luna
  RUTVI_CODEX_GATEWAY_URL: http://host.docker.internal:4041
  COURSE_SERVICE_ID: course.create
  RUTVI_STUDIO_DEMO: "true"
  RUTVI_STUDIO_NAMESPACE: A
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rutvi-exercise
  namespace: rutvi-exercise
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rutvi-exercise
  template:
    metadata:
      labels:
        app: rutvi-exercise
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: rutvi
          image: rutvi-exercise:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: rutvi-runtime
          env:
            - name: HTTP_IDENTITIES
              valueFrom:
                secretKeyRef:
                  name: rutvi-http-auth
                  key: HTTP_IDENTITIES
            - name: RUTVI_STUDIO_SECRET
              valueFrom:
                secretKeyRef:
                  name: rutvi-studio-auth
                  key: RUTVI_STUDIO_SECRET
            - name: RUTVI_CODEX_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rutvi-codex-gateway
                  key: RUTVI_CODEX_GATEWAY_TOKEN
          volumeMounts:
            - name: durable-data
              mountPath: /data
            - name: temporary-files
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
      volumes:
        - name: durable-data
          persistentVolumeClaim:
            claimName: rutvi-data
        - name: temporary-files
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rutvi-exercise
  namespace: rutvi-exercise
spec:
  type: ClusterIP
  selector:
    app: rutvi-exercise
  ports:
    - name: http
      port: 4000
      targetPort: http
